<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fala" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="icon" href="icon.svg" />
  <title>Fala — treino diário de voz</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">
    <!-- Home -->
    <section class="screen" data-screen="home">
      <header class="hero">
        <div class="hero-top">
          <div class="hero-greet">
            <p class="muted small" id="todayLabel">hoje</p>
            <h1>Bom treino, <span id="userName">você</span>.</h1>
          </div>
          <button class="ring" id="streakBtn" aria-label="Sequência">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M13 2s4 4.5 4 9a5 5 0 1 1-10 0c0-2 1-3 1-3s.5 1.5 2 1.5C10 6 13 6 13 2zm-2 18a3 3 0 0 1-3-3c0-1.5 1.5-2.5 1.5-2.5S10 16 12 16s2.5-2 2.5-2 1.5 1 1.5 2.5a3 3 0 0 1-3 3z"/></svg>
            <span id="streakCount">0</span>
          </button>
        </div>

        <div class="card daily">
          <div class="daily-head">
            <p class="muted small">treino de hoje</p>
            <p class="daily-progress"><span id="dailyDone">0</span>/<span id="dailyTotal">5</span></p>
          </div>
          <div class="progress"><div class="progress-bar" id="dailyBar"></div></div>
          <button class="btn primary big" id="startDaily">Começar treino diário</button>
        </div>

        <div class="week">
          <p class="muted small">esta semana</p>
          <div class="week-grid" id="weekGrid"></div>
        </div>
      </header>

      <section class="block">
        <button class="featured" data-cat="fluency">
          <div class="featured-bg"></div>
          <div class="featured-content">
            <p class="muted small">para gagueira e travamentos</p>
            <h2 style="margin-bottom:4px">Fluência</h2>
            <p class="featured-sub">Métodos clínicos: início suave, fala alongada, coro, eco controlado, cancelamento</p>
            <span class="featured-cta">Praticar →</span>
          </div>
        </button>
      </section>

      <section class="block">
        <button class="featured featured-lib" data-cat="library">
          <div class="featured-bg-2"></div>
          <div class="featured-content">
            <p class="muted small">textos para ler em voz alta</p>
            <h2 style="margin-bottom:4px">Biblioteca</h2>
            <p class="featured-sub">29 textos: curtos, parágrafos, discursos, poesia, notícias, crônicas, diálogos</p>
            <span class="featured-cta">Abrir biblioteca →</span>
          </div>
        </button>
      </section>

      <section class="block">
        <h2>Categorias</h2>
        <div class="cat-grid">
          <button class="cat" data-cat="warmup">
            <div class="cat-icon" style="--c1:#ffd166;--c2:#ef476f">🌬️</div>
            <p class="cat-title">Aquecimento</p>
            <p class="cat-sub muted small">Respiração + voz</p>
          </button>
          <button class="cat" data-cat="diction">
            <div class="cat-icon" style="--c1:#8be9fd;--c2:#5b8def">🗣️</div>
            <p class="cat-title">Dicção</p>
            <p class="cat-sub muted small">Trava-línguas</p>
          </button>
          <button class="cat" data-cat="pace">
            <div class="cat-icon" style="--c1:#9b5cff;--c2:#3a1bff">⏱️</div>
            <p class="cat-title">Ritmo</p>
            <p class="cat-sub muted small">Leitura cronometrada</p>
          </button>
          <button class="cat" data-cat="pauses">
            <div class="cat-icon" style="--c1:#7af2c0;--c2:#0aa978">⏸️</div>
            <p class="cat-title">Pausas</p>
            <p class="cat-sub muted small">Espaçamento</p>
          </button>
          <button class="cat" data-cat="articulation">
            <div class="cat-icon" style="--c1:#a8edea;--c2:#fed6e3;color:#1a1a30">🔢</div>
            <p class="cat-title">Articulação</p>
            <p class="cat-sub muted small">Números, volume</p>
          </button>
          <button class="cat" data-cat="expression">
            <div class="cat-icon" style="--c1:#fbc2eb;--c2:#a18cd1">🎭</div>
            <p class="cat-title">Expressão</p>
            <p class="cat-sub muted small">Emoção, ênfase</p>
          </button>
          <button class="cat" data-cat="improv">
            <div class="cat-icon" style="--c1:#ff9d6b;--c2:#ff4d6d">🎤</div>
            <p class="cat-title">Improviso</p>
            <p class="cat-sub muted small">Oratória</p>
          </button>
          <button class="cat" data-cat="record">
            <div class="cat-icon" style="--c1:#f78fff;--c2:#a14bff">🎙️</div>
            <p class="cat-title">Gravar</p>
            <p class="cat-sub muted small">Ouça você mesmo</p>
          </button>
        </div>
      </section>

      <section class="block">
        <h2>Dica do dia</h2>
        <div class="card tip" id="tipCard"></div>
      </section>

      <div class="block">
        <button class="btn ghost" id="resetBtn">Zerar progresso</button>
      </div>
    </section>

    <!-- List screen -->
    <section class="screen hidden" data-screen="list">
      <header class="ex-header">
        <button class="icon-btn" id="listBack" aria-label="Voltar">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M14 6l-6 6 6 6 1.4-1.4L10.8 12l4.6-4.6z"/></svg>
        </button>
        <div class="ex-title">
          <p class="muted small" id="listCount">0 exercícios</p>
          <h2 id="listTitle">Categoria</h2>
        </div>
        <button class="icon-btn" id="listRandom" aria-label="Aleatórios" title="Aleatórios">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M17 3l4 4-4 4v-3h-3.5l-2 2.5L8 6H3V4h5l2.6 3.3L13.4 4H17V3zm0 14v3l-4-4 4-4v3h-3.5l-2.6-3.3-3 4H3v-2h5l3-4 3 4h3v0z"/></svg>
        </button>
      </header>
      <div id="listItems" class="list-items"></div>
    </section>

    <!-- Exercise screen -->
    <section class="screen hidden" data-screen="exercise">
      <header class="ex-header">
        <button class="icon-btn" id="exBack" aria-label="Voltar">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M14 6l-6 6 6 6 1.4-1.4L10.8 12l4.6-4.6z"/></svg>
        </button>
        <div class="ex-title">
          <p class="muted small" id="exKind">categoria</p>
          <h2 id="exName">Exercício</h2>
        </div>
        <button class="icon-btn" id="exClose" aria-label="Fechar">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M18.3 5.7L12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"/></svg>
        </button>
      </header>
      <div id="exBody"></div>
      <footer class="ex-footer">
        <button class="btn ghost" id="exSkip">Pular</button>
        <button class="btn primary" id="exDone">Concluir</button>
      </footer>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js" defer></script>
</body>
</html>
